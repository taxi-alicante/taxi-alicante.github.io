<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0056b3">
    <meta name="description" content="Official Taxi Service in Alicante. Main portal for contact, fares, and accepted payment methods.">
    <title>Taxi in Alicante - Official Portal</title>

    <style>
        :root { 
            --azul: #0056b3; 
            --amarillo: #ffcc00; 
            --negro: #1e1e1e;
            --btc: #F7931A; 
        }
        html { scroll-behavior: smooth; }
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0; 
            text-align: center; 
            background: #ffffff; 
            color: #333; 
            line-height: 1.5; 
        }
        header { 
            background: var(--azul); 
            color: white; 
            padding: 2.5rem 1rem 2rem 1rem; 
            border-bottom: 6px solid var(--amarillo); 
            position: relative; 
        }
        .container { padding: 25px 20px; max-width: 450px; margin: auto; }
        
        .subtitulo {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .btn-hub { 
            display: flex; 
            align-items: center; 
            justify-content: flex-start; 
            padding: 18px 20px; 
            margin-bottom: 16px; 
            border-radius: 14px; 
            text-decoration: none; 
            font-weight: bold; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            transition: 0.2s;
            text-align: left;
        }
        .btn-hub:active { transform: scale(0.98); }
        
        .btn-contacto { 
            background: var(--azul); 
            color: white;
            border-left: 6px solid var(--amarillo);
        }
        .btn-contacto .titulo-btn { color: #ffffff; }
        .btn-contacto .desc-btn { color: #f0f0f0; }

        .btn-pagos { 
            background: var(--negro); 
            color: white;
            border: 1px solid #333333;
            border-left: 6px solid var(--btc); 
        }
        .btn-pagos .titulo-btn { color: #ffffff; }
        .btn-pagos .desc-btn { color: #ffcc00; opacity: 1; }

        .icono { 
            font-size: 1.8rem; 
            margin-right: 15px; 
            flex-shrink: 0;
        }
        .texto-btn { display: flex; flex-direction: column; }
        .titulo-btn { font-size: 1.05rem; line-height: 1.2; }
        .desc-btn { font-size: 0.78rem; font-weight: normal; margin-top: 4px; }

        .idioma-float {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 10px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            line-height: 1;
            color: white;
        }

        .footer { font-size: 0.75rem; color: #999; margin-top: 40px; padding-bottom: 40px; }
    </style>

    <link rel="icon" type="image/png" sizes="512x512" href="contacto/android-chrome-512x512.png">
    <link rel="icon" type="image/png" sizes="192x192" href="contacto/android-chrome-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="contacto/apple-touch-icon.png">
    <link rel="icon" href="contacto/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="32x32" href="contacto/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="contacto/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <!-- Configuración para pantalla completa e iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Taxi Alicante">
</head>
<body>

<header id="inicio">
    <!-- Enlace directo para volver al español -->
    <a href="index.html" class="idioma-float" title="Cambiar a Español">🇪🇸</a>
    
    <div style="font-size: 3rem;">🚕</div>
    <h1>Taxi in Alicante</h1>
    <p>Guarantee, Safety & Professionalism</p>
</header>

<div class="container">
    <p class="subtitulo">Please select the information you wish to view:</p>

    <!-- OPCIÓN 1: CONTACTO Y TARIFAS (INGLÉS) -->
    <a href="https://taxi-alicante.github.io/contacto/en.html" class="btn-hub btn-contacto">
        <span class="icono">📞</span>
        <span class="texto-btn">
            <span class="titulo-btn">BOOKINGS & FARES</span>
            <span class="desc-btn">Call, WhatsApp, Pidetaxi App, vCard & Official Fares</span>
        </span>
    </a>

    <!-- OPCIÓN 2: MÉTODOS DE PAGO (INGLÉS) -->
    <a href="https://taxi-alicante.github.io/metodos-de-pago/en.html" class="btn-hub btn-pagos">
        <span class="icono">💳</span>
        <span class="texto-btn">
            <span class="titulo-btn">PAYMENT METHODS</span>
            <span class="desc-btn">Credit Cards, Bizum, Cash & Bitcoin (Lightning / On-Chain)</span>
        </span>
    </a>

    <div class="footer">
        © <span id="year"></span> Taxi Alicante - Independent Website<br>
    </div>
</div>

<script>
    document.getElementById("year").textContent = new Date().getFullYear();

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(reg => console.log('SW Raíz registrado:', reg.scope))
                .catch(err => console.error('Error al registrar SW Raíz:', err));
        });
    }
</script>

</body>
</html>
